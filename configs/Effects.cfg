// Procedural effects drawn by FarFutureWeaponry.dll (no image assets).

// A flash and a light at every explosion from this model path. Each weapon's explModelPath points at its own copy of
// BDArmory's explosion model, so its explosions have their own pool.
//   color: r, g, b, a (0-255); size: m across at full size; duration: s; lightRange: m; lightIntensity: Unity units
FFW_IMPACT_FLASH
{
	explosion = FarFutureWeaponry/FX/Hits/antimatterHit
	color = 255, 70, 190, 255
	size = 14
	duration = 0.6
	lightRange = 80
	lightIntensity = 6
}
FFW_IMPACT_FLASH
{
	explosion = FarFutureWeaponry/FX/Hits/neutronHit
	color = 170, 215, 255, 255
	size = 4
	duration = 0.25
	lightRange = 25
	lightIntensity = 4
}

// A glowing beam left in the air behind every projectile of this BULLET type, fading after the shot has passed.
//   width: m; fade: s each point stays (it holds briefly, then fades); spacing: m between points
FFW_BULLET_TRAIL
{
	bullet = ffwGaussSlug
	color = 90, 160, 255, 255
	width = 0.5
	fade = 3
	spacing = 4
}

// Tachyon Gun hits: a small green flash and sparkles; time on the craft hit runs 10% slower for 2 s (each hit extends
// it), the whole craft rusts a little, and the part hit takes 30 damage (none of it with an active Tachyon-be-gone).
FFW_IMPACT_FLASH
{
	explosion = FarFutureWeaponry/FX/Hits/tachyonHit
	color = 90, 255, 110, 255
	size = 2.5
	duration = 0.2
	lightRange = 15
	lightIntensity = 2
	slowFactor = 0.9
	slowSeconds = 2
	rust = 0.02
	sparkles = 14
	damage = 30
}
