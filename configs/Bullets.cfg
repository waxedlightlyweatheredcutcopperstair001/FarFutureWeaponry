// Antimatter-ial Rifle: 0.00035 units of antimatter (36 GJ/unit) = 12.6 MJ, about 3 kg of TNT, in a 20 mm round.
BULLET
{
	name = ffwAntimatterRound
	DisplayName = Antimatter round
	caliber = 20
	bulletVelocity = 1400
	bulletMass = 0.12
	explosive = True
	incendiary = False
