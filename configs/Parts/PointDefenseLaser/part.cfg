// Point-Defense Laser Array. Placeholder model: BDArmory's airborne laser turret (CC-BY-SA 2.0), retinted.
// BDArmory's missile defence (isAPS, missile mode: missiles and bombs), dual mode so it can also engage craft when
// nothing is incoming. HeatRay pulses: each one heats what it hits rather than doing structural damage.
PART
{
	name = ffwPointDefenseLaser
	module = Part
	author = Far Future Weaponry (model: BahamutoD, BDArmory)

	mesh = model.mu
	rescaleFactor = 1
	node_attach = 0.0, -0.573, 0, 0, -1, 0, 1
	node_stack_bottom = 0.0, -0.573, 0, 0, -1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 18000
	cost = 8000
	category = Utility
	bdacategory = Laser Turrets
	VABORGANIZER
	{
		organizerSubcategory = bdaLaserTurrets
	}
	subcategory = 0
	title = Point-Defense Laser Array
	manufacturer = Far Future Weaponry
	description = “The knuckleheads in the lab say that one Point-Defense Laser won’t be able to handle a whole missile swarm. How about 50 of ‘em? With a little duct tape and a lot of electricity, you can make a pretty damn sweet looking lightshow.” Automatically shoots down incoming missiles and bombs within 2.5 km, burning them with rapid magenta laser pulses. Draws 160 ElectricCharge per second while firing.
	tags = ffw point defense laser pdl aps ciws turret missile
	attachRules = 1,1,0,0,1
	bulkheadProfiles = size1, srf

	mass = 0.6
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 60
	maxTemp = 3600
	stagingIcon = SOLID_BOOSTER

	MODULE
	{
		name = ModuleTurret
		pitchTransformName = aimPitch
		yawTransformName = aimRotate
		pitchSpeedDPS = 400
		yawSpeedDPS = 400
		maxPitch = 90
		minPitch = -15
		yawRange = 360
		smoothRotation = true
		smoothMultiplier = 30
	}

	MODULE
	{
		name = ModuleWeapon
		shortName = Point-Defense Laser

		fireTransformName = fireTransform
		hasDeployAnim = true
		deployAnimName = deployAnimation
		hasFireAnimation = false

		weaponType = laser
		pulseLaser = true
		HeatRay = true
		laserDamage = 25
		tanAngle = 0.00001
		aperture = 0.1315
		ammoName = ElectricCharge
		requestResourceAmount = 8
		roundsPerMinute = 1200
		maxDeviation = 0.02
		maxEffectiveDistance = 2500
		maxTargetingRange = 2500

		isAPS = true
		APSType = missile
		dualModeAPS = true

		// Razor-thin magenta pulses.
		startColor = 255, 120, 245, 220
		projectileColor = 255, 40, 230, 200
		tracerStartWidth = 0.05
		tracerMaxStartWidth = 0.05
		tracerEndWidth = 0.05
		tracerMaxEndWidth = 0.05

		maxHeat = 3600
		heatPerShot = 30
		heatLoss = 900

		fireSoundPath = FarFutureWeaponry/Parts/PointDefenseLaser/laser
		chargeSoundPath = FarFutureWeaponry/Parts/PointDefenseLaser/charge
		overheatSoundPath = FarFutureWeaponry/Parts/PointDefenseLaser/drain
		oneShotSound = false
		soundRepeatTime = 0
	}
}
