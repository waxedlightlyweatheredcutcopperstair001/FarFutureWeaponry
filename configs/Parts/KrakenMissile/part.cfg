	attachRules = 1,1,0,0,1
	bulkheadProfiles = srf

	mass = 0.17
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600

	MODULE
	{
		name = MissileLauncher
		shortName = Kraken Missile
		thrust = 50
		cruiseThrust = 22
		dropTime = 0.5
		boostTime = 2.2
		cruiseTime = 60
		guidanceActive = true
		maxTurnRateDPS = 35
		decoupleSpeed = 5
		audioClipPath = FarFutureWeaponry/Sounds/rocketLoop
		exhaustPrefabPath = FarFutureWeaponry/FX/Exhaust/smallExhaust
		boostExhaustPrefabPath = FarFutureWeaponry/FX/Exhaust/mediumExhaust
		boostTransformName = boostTransform
		boostExhaustTransformName = boostTransform
		optimumAirspeed = 1200
		aero = true
		liftArea = 0.0025
		steerMult = 8
		maxTorque = 60
		maxAoA = 35
