// Kraken Missile. Its own model (models/KrakenMissile/build.py): an enlarged Hellfire in black and red, a lump of flesh on
// wires under a glass nose dome, throbbing and glowing (ModuleFFWPulse). FFW consciousness tracking (crewed craft
// within 5 km); a small charge; every Kerbal aboard what it hits dies, under a wave of red light (ModuleFFWBomb).
PART
{
	name = ffwKrakenMissile
	module = Part
	author = Far Future Weaponry

	mesh = model.mu
	rescaleFactor = 1
	node_attach = 0.0, 0.125, 0.0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.125, 0.0, 0, 1, 0, 0

	TechRequired = precisionEngineering
	entryCost = 10000
	cost = 15000
	category = Utility
	bdacategory = Missiles
	VABORGANIZER
	{
		organizerSubcategory = bdaMissiles
	}
	subcategory = 0
	title = Kraken Missile
	manufacturer = Bobrigh Weaponry Inc.
	description = “God knows how they did it, but the boys in the lab managed to summon the Kraken. Or, at least, part of it. Anyway, we shoved that lump of flesh in a missile, hooked it up to some electrodes, and let it work its magic. Turns out it hates living beings so much, it actively seeks out and destroys any source of ordered thought within a 5km radius of itself. Just make sure you point it in the right direction.” - Cave Kerman, director of science at Bobrigh Weaponry Inc. Homes on Kerbal minds within 5 km; needs a Consciousness Field Sensor aboard. Next to no blast; every Kerbal aboard the craft it hits dies, as a red wave crawls over its hull.
