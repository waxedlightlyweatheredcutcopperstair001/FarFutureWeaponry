// Long Range Nuclear Cruise Missile. Its own model (models/CruiseMissile/build.py): after Project Pluto's SLAM, 8 m long,
// with three boosters BDArmory drops after the boost and a ramjet nozzle that glows once it runs. BDArmory's cruise
// guidance to a GPS target, a 1 Mt warhead (damage radius scaled from the B-83's by the cube root of the yield: 7 km),
// and a nuclear ramjet (ModuleFFWRamjet): thrust only in air. About 100 km at 300 m/s.
PART
{
	name = ffwCruiseMissile
	module = Part
	author = Far Future Weaponry

	mesh = model.mu
	rescaleFactor = 1
	node_attach = 0.0, 0.25, 0.0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.25, 0.0, 0, 1, 0, 0

	TechRequired = precisionEngineering
	entryCost = 10000
	cost = 60000
	category = Utility
	bdacategory = Missiles
	VABORGANIZER
	{
		organizerSubcategory = bdaMissiles
	}
	subcategory = 0
	title = Long Range Nuclear Cruise Missile
	manufacturer = Bobrigh Weaponry Inc.
	description = “There's only so much jet fuel you can fit on a cruise missile, which is really putting a damper on our long-range missions. Our solution? A big ol’ unshielded nuclear reactor! This nuclear ramjet has enough delta-v and radiation to make an Orion drive blush.” - Cave Kerman, director of science at Bobrigh Weaponry Inc. Three boosters throw it into the air and fall away; then it flies to a GPS target up to 100 km away, low, on a nuclear ramjet that only works in air, and goes off with 1 megaton. Damage radius about 7 km.
	tags = ffw nuclear cruise missile gps ramjet tomahawk
	attachRules = 1,1,0,0,1
	bulkheadProfiles = srf

	mass = 2.2
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600

	MODULE
	{
		name = MissileLauncher
		shortName = Nuclear Cruise Missile
		thrust = 130         // the three boosters (sized like BDArmory's AGM-86 for its weight)
		cruiseThrust = 22
		dropTime = 0.3        // (a short drop: on a ground launcher a long one lands it on the ground)
		boostTime = 3.5
		cruiseTime = 380
		guidanceActive = true
		maxTurnRateDPS = 20
		decoupleSpeed = 5
		audioClipPath = FarFutureWeaponry/Sounds/jet
		optimumAirspeed = 300
		homingType = Cruise
		targetingType = gps
		// The boosters: three "boosterTransform"s in the model, each with a "boostExhaust"; dropped after the boost.
		boostTransformName = boosterTransform
		boostExhaustTransformName = boostExhaust
		boostExhaustPrefabPath = FarFutureWeaponry/FX/Exhaust/mediumExhaust
		decoupleBoosters = true
		boosterDecoupleSpeed = 6
		boosterMass = 0.45
		exhaustPrefabPath = FarFutureWeaponry/FX/Exhaust/jetExhaustPrefab
		maxAoA = 35
		aero = true
		liftArea = 0.015
		steerMult = 8
		maxTorque = 150
		terminalManeuvering = false
		minStaticLaunchRange = 10000
		maxStaticLaunchRange = 100000
		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false
	}
	MODULE
	{
		name = BDModuleNuke
		thermalRadius = 7000
		yield = 1000
		fluence = 1
		isEMP = true
		reportingName = Nuclear Cruise Missile
	}
	MODULE
	{
		name = ModuleFFWRamjet
		fullDensity = 0.6
		minDensity = 0.02
		climbAngle = 30       // the boosters pitch it up off a ground launcher...
		climbBelow = 300      // ...until it's this high (m above the ground); then BDArmory's guidance flies it
	}
	MODULE
	{
		name = ModuleFFWTrail   // the reactor's faint glow left hanging in the air
		color = 255, 190, 140, 70
		width = 1.4
		fade = 4
		spacing = 8
		flicker = 0.15
	}
	MODULE
	{
		name = ModuleFFWArmGlow      // the ramjet's nozzle, red-hot once it runs (after the boost)
		color = 255, 110, 40, 255
		armDelay = 3.8        // (dropTime 0.3 + boostTime 3.5: when the ramjet takes over)
		rampSeconds = 1.5
		pulseRate = 3
		pulseDepth = 0.1
	}
}
