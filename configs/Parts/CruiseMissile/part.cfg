// Long Range Nuclear Cruise Missile. Placeholder model: NKDR's Tomahawk (CC-BY-SA 4.0), retinted. BDArmory's cruise
// guidance to a GPS target, a 1 Mt warhead (damage radius scaled from the B-83's by the cube root of the yield: 7 km),
// and a nuclear ramjet (ModuleFFWRamjet): thrust only in air. About 100 km at 300 m/s.
PART
{
	name = ffwCruiseMissile
	module = Part
	author = Far Future Weaponry (model: Harpwner, North Kerbin Dynamics)

	mesh = model.mu
	rescaleFactor = 1
	node_attach = 0.0, 0.2, -0.3, 0, 1, 0, 0
	node_stack_top = 0.0, 0.2, -0.3, 0, 1, 0, 0

	TechRequired = precisionEngineering
	entryCost = 10000
	cost = 60000
	category = Utility
	bdacategory = Missiles
	VABORGANIZER
	{
		organizerSubcategory = bdaMissiles
	}
	subcategory = 0
	title = Long Range Nuclear Cruise Missile
	manufacturer = Bobrigh Weaponry Inc.
	description = “There's only so much jet fuel you can fit on a cruise missile, which is really putting a damper on our long-range missions. Our solution? A big ol’ unshielded nuclear reactor! This nuclear ramjet has enough delta-v and radiation to make an Orion drive blush.” - Cave Kerman, director of science at Bobrigh Weaponry Inc. Flies to a GPS target up to 100 km away, low, on a nuclear ramjet that only works in air, and goes off with 1 megaton. Damage radius about 7 km.
	tags = ffw nuclear cruise missile gps ramjet tomahawk
	attachRules = 1,1,0,0,1
	bulkheadProfiles = srf

	mass = 1.4
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600

	MODULE
	{
		name = MissileLauncher
		shortName = Nuclear Cruise Missile
		thrust = 15
		cruiseThrust = 12
		dropTime = 1
		boostTime = 3
		cruiseTime = 380
		guidanceActive = true
		maxTurnRateDPS = 20
		decoupleSpeed = 5
		audioClipPath = FarFutureWeaponry/Sounds/jet
		optimumAirspeed = 300
		homingType = Cruise
		targetingType = gps
		rotationTransformName = rotationTransform
		deployAnimationName = deploy_Tomohawk
		deployedDrag = 0.0225
		deployTime = 0.3
		maxAoA = 25
		aero = true
		liftArea = 0.0075
		steerMult = 1
		maxTorque = 58
		terminalManeuvering = false
		minStaticLaunchRange = 10000
		maxStaticLaunchRange = 100000
		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false
	}
	MODULE
	{
		name = BDModuleNuke
		thermalRadius = 7000
		yield = 1000
		fluence = 1
		isEMP = true
		reportingName = Nuclear Cruise Missile
	}
	MODULE
	{
		name = ModuleFFWRamjet
		fullDensity = 0.6
		minDensity = 0.02
	}
	MODULE
	{
		name = ModuleFFWTrail   // the reactor's faint glow left hanging in the air
		color = 255, 190, 140, 70
		width = 1.4
		fade = 4
		spacing = 8
		flicker = 0.15
	}
}
