// Neutron Gun. Placeholder model: BDArmory Extended's medium combat laser (CC-BY-SA 4.0), retinted.
// A pulse laser whose pulses explode where they hit (HEpulses: laserDamage / 10000 kg of TNT each).
PART
{
	name = ffwNeutronGun
	module = Part
	author = Far Future Weaponry (model: BahamutoD, BDArmory Extended)

	mesh = Model.mu
	rescaleFactor = 0.8
	node_attach = 0.0, 0, 0, 0, -1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 9000
	cost = 4200
	category = Utility
	bdacategory = Lasers
	VABORGANIZER
	{
		organizerSubcategory = bdaGuns
	}
	subcategory = 0
	title = Neutron Gun
	manufacturer = Bobrigh Weaponry Inc.
	description = “Gravitational field manipulation allows us to finally accelerate neutrons without having to deal with pesky particle collisions. Initially, this new technology was going to be used as a more precise radiotherapy treatment for cancer, but we figured “Hey, why not use it to give our enemies cancer instead?” - Cave Kerman, director of science at Bobrigh Weaponry Inc. ” A thin, rapid-fire neutron beam that sets off a small explosion wherever it lands. Uses 40 ElectricCharge per pulse (200 per second).
	tags = ffw neutron beam laser gun
	attachRules = 0,1,0,0,1
	bulkheadProfiles = srf

	mass = 0.2
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 60
	maxTemp = 3600
	stagingIcon = SOLID_BOOSTER

	MODULE
	{
		name = ModuleWeapon
		shortName = Neutron Gun

		fireTransformName = fireTransform
		hasDeployAnim = false
		hasFireAnimation = false
		spinDownAnimation = false

		weaponType = laser
		pulseLaser = true
		HEpulses = true
		laserDamage = 700
		tanAngle = 0.000005
		aperture = 0.2
		ammoName = ElectricCharge
		requestResourceAmount = 40
		roundsPerMinute = 300
		useRippleFire = false
		maxDeviation = 0.15
		maxEffectiveDistance = 2500
		maxTargetingRange = 3000
		autoProxyTrackRange = 1200

		// Thin electric-blue beam.
		startColor = 150, 210, 255, 200
		projectileColor = 70, 160, 255, 200
		tracerStartWidth = 0.08
		tracerMaxStartWidth = 0.08
		tracerEndWidth = 0.08
		tracerMaxEndWidth = 0.08

		maxHeat = 3600
		heatPerShot = 250
		heatLoss = 825

		// Its own copy of BDArmory's small explosion: the plugin watches this pool and adds the bright flashes.
		explModelPath = FarFutureWeaponry/FX/Hits/neutronHit
		explSoundPath = FarFutureWeaponry/Sounds/subExplode
		fireSoundPath = FarFutureWeaponry/Parts/NeutronGun/pulse
		oneShotSound = true
	}
}
